# Horizon performs one agent turn per process.
mode: unit

# Include <home>/SOUL.md in agent instructions when explicitly enabled.
soul_enabled: false

# Profile selected when --model is omitted.
default_model: chatting
models:
  chatting:
    # Provider model identifier, for example the identifier from its model list.
    model: ""
    reasoning: medium
    # Token threshold for context compaction. Adjust to the model's context
    # window, leaving room for the next input, tool results and generated text.
    compact_threshold: 200000

provider:
  # Base URL of a Responses-compatible API, e.g. https://api.openai.com/v1.
  # Horizon adds /responses and /responses/compact.
  url: ""
  # API key issued by your provider. Keep this file private.
  key: ""

# Separate provider for command decisions (OpenRouter Decisions API).
decision:
  provider:
    url: "https://openrouter.ai/api"
    key: ""
  model: "typesafe/jev-1.13"

# Set either limit to 0 to disable it.
limits:
  max_model_requests: 128
  max_turn_duration: 120m

# Skill directory IDs excluded from the next agent turn.
disabled_skills: []

# Optional plugin-owned settings, keyed by command name (plugins.<name>).
# Decision uses the shared decision section above and needs no own settings.
# Run 'horizon telegram init' to add Telegram plugin settings (plugins.telegram).

# Installed agent extensions, explicitly enabled in this order.
agent_plugins: []
