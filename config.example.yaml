# Horizon performs one agent turn per process.
mode: unit

# Source for installation and updates; models use their own provider settings.
installation:
  source:
    type: release

# Include <home>/SOUL.md in agent instructions when explicitly enabled.
soul_enabled: false

# Profile selected when --model is omitted.
default_model: chatting
# Profile used for boolean decisions; reasoning is always disabled for this role.
decision_model: decision
models:
  chatting:
    provider: default
    # Provider model identifier, for example the identifier from its model list.
    model: ""
    reasoning: medium
    # Token threshold for context compaction. Adjust to the model's context
    # window, leaving room for the next input, tool results and generated text.
    compact_threshold: 200000

  decision:
    provider: default
    model: "openai/gpt-6-luna"
    reasoning: none
    compact_threshold: 200000

# Named provider connections; model profiles refer to these names.
providers:
  default:
    # Base URL, e.g. https://openrouter.ai/api/v1 or https://api.openai.com/v1.
    # Horizon adds /responses and /responses/compact.
    url: ""
    # Provider API key. Keep this file private.
    key: ""

# Built-in persistent memory. Set enabled to false to omit memory context and
# tools from agent turns; explicit `horizon memory` commands remain available.
memory:
  enabled: true
  threshold: 5
  interval: 24h
  model: chatting
  note_limit: 4096
  summary_limit: 16384
  context_limit: 16000
  api_timeout: 45s
  retry_interval: 5m
  max_pending_notes: 256
  max_pending_bytes: 262144

# Set an individual limit to 0 to disable it.
limits:
  max_model_requests: 128
  max_input_tokens: 2000000
  max_turn_duration: 120m

# Skill directory IDs excluded from the next agent turn.
disabled_skills: []

# Optional plugin-owned settings. Installation adds missing plugin sections.
plugins:
  agent-timer:
    access: write
    reload_interval: 30s

# Installed agent extensions, explicitly enabled in this order.
agent_plugins: []
